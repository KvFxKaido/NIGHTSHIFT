name: CI

# Push on master only: a branch's commits are covered by its pull request, and
# unfiltered triggers ran every PR commit twice (seen on #11).
on:
  push:
    branches: [master]
  pull_request:

# One run per ref: pushing again cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:facade
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facade-menu-captures
          path: artifacts/facade-*.png

  # The deterministic simulation suite: every handling gate, the replay checks and
  # the revision pins. It is the project's real gate (CLAUDE.md, "Commands"), and
  # until 2026-09-19 it ran only on whoever remembered it, so a push that broke the
  # tests was green here. `pnpm test` runs all of it in one go, which is what to run
  # locally; here it is split, because the whole suite took 16.1 minutes on a runner.
  #
  # Two files are 40% of the suite's 830 seconds of work -- race-generator at 178 s
  # and critique-alder at 152 s (measured 2026-09-19) -- so the slowest single file
  # sets the floor and balancing the rest buys nothing. They get a shard each and
  # everything else shares one, which new test files join without being listed.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: generator
            files: tests/race-generator.test.ts
          - shard: critique
            files: tests/critique-alder.test.ts
          - shard: rest
            files: $(ls tests/*.test.ts | grep -v -e race-generator -e critique-alder)
    name: tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test ${{ matrix.files }}
        timeout-minutes: 20
