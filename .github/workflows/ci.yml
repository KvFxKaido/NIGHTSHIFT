name: CI

# Push on main only (the default branch, master until 2026-09-25): a branch's commits are covered by its pull request, and
# unfiltered triggers ran every PR commit twice (seen on #11).
on:
  push:
    branches: [main]
  pull_request:

# One run per ref: pushing again cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck and production build: what CI ran alone until 2026-09-19.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # The browser checks, one job each (2026-09-25). Each starts its own dev server and drives the real page, so none
  # needs the build or another's result, and one after another in the build job they were 8.6 of its 9.7 minutes
  # (facade 5.0, Cinder 2.5, garage shots 1.1). All three use the SwiftShader launch, without which a runner with no
  # GPU stalls (PR #11).
  #  - facade: the Wharf Garage facade menu.
  #  - cinder: the Cinder's body kits, wheels, spoilers and paint picker.
  #  - garage-shots: the garage cutscenes: each ends, can be skipped on every input, and freezes the sim behind it.
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: facade
            captures: artifacts/facade-*.png
          - check: cinder
            captures: artifacts/cinder-*.png
          - check: garage-shots
            captures: artifacts/garage-shot-*.png
    name: browser (${{ matrix.check }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:${{ matrix.check }}
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-captures-${{ matrix.check }}
          path: ${{ matrix.captures }}

  # The deterministic simulation suite: every handling gate, the replay checks and
  # the revision pins. It is the project's real gate (CLAUDE.md, "Commands"), and
  # until 2026-09-19 it ran only on whoever remembered it, so a push that broke the
  # tests was green here. `pnpm test` runs all of it in one go, which is what to run
  # locally; here it is split, because the whole suite took 16.1 minutes on a runner.
  #
  # race-generator (214 s) and critique-alder (176 s) are still the two heaviest
  # files, so they anchor a shard each. The other 89 are 563 s with no hot spot to
  # split: the median file is 1.4 s, 55 of them are under 2 s, and the longest is
  # night at 46 s (timed one file at a time, 2026-09-19). The top ten are 55% of
  # that shard, so the balance comes from naming a few of them beside the anchors.
  # On the runner that took the wall time from 623 s to 355: generator 313 s,
  # critique 282, rest 336, and 43 + 49 + 505 = 597 tests, the whole suite.
  # Those timings are not the local ones scaled -- `rest` runs 81 files with real
  # parallelism between them, `critique` only six -- so balance by measuring here.
  #
  # `rest` stays defined by EXCLUSION so a new test file joins it without being
  # listed anywhere. The pattern anchors on `.test.ts$` because the names are
  # prefixes of each other: a bare `rival` would swallow rival-racing,
  # rival-speed, rival-card and rival-height.
  #
  # Below about 420 s there is nothing here to win: the facade check, in its own
  # job since 2026-09-25, is the floor.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: generator
            files: tests/race-generator.test.ts tests/night.test.ts tests/rival.test.ts tests/traffic-intent.test.ts
          - shard: critique
            files: tests/critique-alder.test.ts tests/arena.test.ts tests/district.test.ts tests/encounter.test.ts tests/cruisers.test.ts tests/street-circuit.test.ts
          - shard: rest
            files: $(ls tests/*.test.ts | grep -vE 'tests/(race-generator|critique-alder|night|rival|arena|traffic-intent|district|encounter|cruisers|street-circuit)\.test\.ts$')
    name: tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test ${{ matrix.files }}
        timeout-minutes: 20
